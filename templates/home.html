<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<title>Salon P&L</title></head>
<body>
<header class="site-header">
    <div>
        <p class="brand-name">Salon P&amp;L</p>
        <p class="brand-tag">Invoicing &amp; expense tracking, v.TB</p>
    </div>
    <svg class="brand-mark" width="30" height="39" viewBox="0 0 100 130" fill="currentColor" aria-hidden="true">
        <path d="M22 4 C26 4 30 8 33 13 L58 63 C61 68 61 73 58 77 L54 82 C51 78 49 74 47 70 L20 16 C18 12 19 7 22 4 Z"/>
        <path d="M50 80 L70 108 L64 114 L46 88 Z"/>
        <circle cx="76" cy="112" r="13" fill="none" stroke="currentColor" stroke-width="7"/>
        <path d="M84 122 C88 126 90 130 88 134" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M78 4 C74 4 70 8 67 13 L42 63 C39 68 39 73 42 77 L46 82 C49 78 51 74 53 70 L80 16 C82 12 81 7 78 4 Z"/>
        <path d="M50 80 L30 108 L36 114 L54 88 Z"/>
        <circle cx="24" cy="112" r="13" fill="none" stroke="currentColor" stroke-width="7"/>
        <circle cx="50" cy="80" r="3"/>
    </svg>
    <nav class="site-nav">
        <a href="/" class="active">Home</a>
        <a href="/report">Report</a>
    </nav>
</header>
<h1>Add a new entry</h1>
<div class="card">
<form action="/add" method="POST">
    <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
    </div>
    <div class="field">
        <label for="entryType">Type</label>
        <select name="entry_type" id="entryType" onchange="updateCategories()">
            <option value="sale">Sale</option>
            <option value="expense">Expense</option>
        </select>
    </div>
    <div class="field">
        <label for="categorySelect">Category</label>
        <select name="category" id="categorySelect" required></select>
    </div>
    <div class="field">
        <label for="client">Client</label>
        <input type="text" id="client" name="client">
    </div>
    <div class="field">
        <label for="amount">Amount</label>
        <input type="number" step="0.01" id="amount" name="amount" required>
    </div>
    <button type="submit">Add entry</button>
</form>
</div>
<!-- Category dropdown is populated dynamically based on entry type
     (Sale vs Expense), so it must run before any script below that
     might trigger a page navigation (see the invoice script). -->
<script>
    const categories = {
        sale: ["Cut", "Style", "Wash/Shampoo", "Color"],
        expense: ["Supplies", "Rent", "Payroll", "Utilities"]
    };

    function updateCategories() {
        const type = document.getElementById("entryType").value;
        const select = document.getElementById("categorySelect");
        select.innerHTML = "";
        categories[type].forEach(function(cat) {
            const option = document.createElement("option");
            option.value = cat;
            option.textContent = cat;
            select.appendChild(option);
        });
    }

    updateCategories();
</script>
{% if invoice_client %}
<!-- After adding a sale, the /add route redirects here with invoice
     details in the query string. This triggers the PDF download, then
     immediately cleans the URL with replaceState so refreshing the
     page doesn't regenerate the invoice. -->
<script>
    window.location.href = "/invoice/{{ invoice_client }}/{{ invoice_amount }}/{{ invoice_date }}";
    window.history.replaceState({}, document.title, "/");
</script>
{% endif %}
</body>
</html>
